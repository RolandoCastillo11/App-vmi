<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autenticando con Google...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #3c4043;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e8f0fe;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Conectando con Google...</p>

  <script>
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function handleGoogleCallback() {
      // 1. Extraer id_token del hash (#id_token=... o ?id_token=...)
      const hash = window.location.hash.substring(1);
      const search = window.location.search.substring(1);
      const params = new URLSearchParams(hash || search);
      const idToken = params.get('id_token');

      if (idToken) {
        const payload = parseJwt(idToken);
        if (payload && payload.email) {
          const userPayload = {
            id: payload.sub || 'google-' + Math.random().toString(36).substring(2, 9),
            email: payload.email.toLowerCase(),
            name: payload.name || payload.email.split('@')[0],
            picture: payload.picture || null,
            idToken: idToken
          };

          // Guardar último correo y usuario pendiente de Google
          localStorage.setItem('vmi_last_google_email', userPayload.email);
          localStorage.setItem('vmi_pending_google_user', JSON.stringify(userPayload));

          // Enviar al opener si existe
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                user: userPayload
              }, '*');
            }
          } catch (e) {}

          // Soporte secundario por BroadcastChannel
          try {
            const bc = new BroadcastChannel('vmi_google_auth_channel');
            bc.postMessage({
              type: 'GOOGLE_AUTH_SUCCESS',
              user: userPayload
            });
            bc.close();
          } catch (e) {}

          // Redirigir a la app si no se abrió como popup
          setTimeout(() => {
            if (window.opener) {
              window.close();
            } else {
              window.location.href = '/';
            }
          }, 350);
          return;
        }
      }

      // Si hubo error de Google
      const error = params.get('error');
      if (error) {
        console.warn('Google OAuth error:', error);
        try {
          if (window.opener) {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_ERROR',
              error: error
            }, '*');
            window.close();
          } else {
            window.location.href = '/';
          }
        } catch (e) {}
      }
    }

    handleGoogleCallback();
  </script>
</body>
</html>

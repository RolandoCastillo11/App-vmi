<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Isometric Logistics Box / Warehouse Cube -->
  <g transform="translate(256, 215)">
    <!-- Top face -->
    <polygon points="0,-115 110,-60 0,-5 -110,-60" fill="url(#accent)" />
    <!-- Left face -->
    <polygon points="-110,-60 0,-5 0,115 -110,60" fill="#fef3c7" opacity="0.92" />
    <!-- Right face -->
    <polygon points="0,-5 110,-60 110,60 0,115" fill="#fde68a" opacity="0.82" />
    <!-- Center tape / VMI route lines -->
    <polyline points="-55,-87 0,-60 55,-87" fill="none" stroke="#c2410c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="-5" x2="0" y2="115" stroke="#9a3412" stroke-width="8" />
  </g>

  <!-- VMI Pill Badge at Bottom -->
  <rect x="116" y="366" width="280" height="84" rx="42" fill="#7c2d12" stroke="#fde68a" stroke-width="5" />
  <text x="256" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#fffbeb" text-anchor="middle" letter-spacing="6">VMI</text>
</svg>

